spring:
  application:
    name: spring-ai-intro
  threads:
    virtual:
      enabled: true
  ai:
    azure:
      openai:
        api-key: ${GITHUB_TOKEN}
        endpoint: "https://models.inference.ai.azure.com"
        chat:
          options:
            model: gpt-4o
    metrics:
      enabled: true

  docker:
    compose:
      lifecycle-management: start_only

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
logging:
  level:
    org.kgromov.observability: debug
